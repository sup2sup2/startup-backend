spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/startup_app}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


seoul.api.key=${SEOUL_API_KEY}

# Authentication
auth.token.secret=${AUTH_TOKEN_SECRET}
auth.token.expiration-seconds=${AUTH_TOKEN_EXPIRATION_SECONDS:43200}

# Comma-separated browser origins allowed to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://startup-frontend-rho.vercel.app,http://localhost:3000}

# AWS S3 
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region=ap-northeast-2
cloud.aws.s3.bucket=flood-report-sup2

server.port=${PORT:8080}
