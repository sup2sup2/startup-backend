spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/startup_app}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:3000}

# Optional read replica. Reads use the primary database when this value is empty,
# and automatically retry on the primary if the replica is unavailable.
app.datasource.replica.url=${DB_REPLICA_URL:}
app.datasource.replica.username=${DB_REPLICA_USERNAME:}
app.datasource.replica.password=${DB_REPLICA_PASSWORD:}
app.datasource.replica.maximum-pool-size=${DB_REPLICA_POOL_MAX_SIZE:4}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


seoul.api.key=${SEOUL_API_KEY}
seoul.api.base-url=${SEOUL_API_BASE_URL:http://openAPI.seoul.go.kr:8088}

# Redis is optional so the existing single-server deployment keeps working.
app.cache.redis.enabled=${REDIS_ENABLED:false}
app.cache.rainfall-ttl=${RAINFALL_CACHE_TTL:120s}
app.cache.risk-ttl=${RISK_CACHE_TTL:20s}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Authentication
auth.token.secret=${AUTH_TOKEN_SECRET}
auth.token.expiration-seconds=${AUTH_TOKEN_EXPIRATION_SECONDS:43200}

# Comma-separated browser origins allowed to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://startup-frontend-rho.vercel.app,http://localhost:3000}

# AWS S3 
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region=ap-northeast-2
cloud.aws.s3.bucket=flood-report-sup2

server.port=${PORT:8080}
