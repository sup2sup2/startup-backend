services:
  - type: web
    name: startup-backend
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/reports
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SEOUL_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://startup-frontend-rho.vercel.app
      - key: JPA_DDL_AUTO
        value: update
