services:
  mysql-primary:
    image: mysql:8.0.36
    container_name: flood-mysql-primary
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: startup_app
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD:-local-replication-password}
      MYSQL_REPLICA_READ_PASSWORD: ${MYSQL_REPLICA_READ_PASSWORD:-local-reader-password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-primary-data:/var/lib/mysql
      - ./docker/mysql/primary-init.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql-replica:
    image: mysql:8.0.36
    container_name: flood-mysql-replica
    command:
      - --server-id=2
      - --relay-log=relay-bin
      - --read-only=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: startup_app
    ports:
      - "3308:3306"
    volumes:
      - mysql-replica-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  replica-init:
    image: mysql:8.0.36
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD:-local-replication-password}
      MYSQL_REPLICA_READ_PASSWORD: ${MYSQL_REPLICA_READ_PASSWORD:-local-reader-password}
    volumes:
      - ./docker/mysql/configure-replica.sh:/configure-replica.sh:ro
    entrypoint: ["/bin/bash", "/configure-replica.sh"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    container_name: flood-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-primary-data:
  mysql-replica-data:
  redis-data:
